# The models in src/ are autogenerated, but index.d.ts is hand maintained: it decides which types
# are part of this package's public API. Nothing used to verify that the two fit together, so an
# export pointing at a model that was renamed or removed by the generator could be published.
name: TypeScript

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  compile:
    name: Compile the published types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compile the published types
        # Not only index.d.ts: everything in src/ is shipped in the tarball and can be deep
        # imported, so a model the generator broke must fail here even when nothing exports it.
        # The TypeScript version is pinned exactly: a floating minor can turn this red on an
        # unchanged tree.
        run: npx --yes -p typescript@5.9.2 tsc --noEmit --strict index.d.ts src/*.d.ts
