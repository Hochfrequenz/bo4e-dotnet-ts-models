on:
  release:
    types:
      - published

# a second release running concurrently could publish a version that makes the
# first one a silent no-op, so serialise them
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required for npm OIDC trusted publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # needed by the ancestor check below
          fetch-depth: 0
          # no third-party code should run with the job token on disk
          persist-credentials: false
      # A release can be cut from ANY commit on ANY branch (target_commitish),
      # and this job can mint an npm publish token for this package. Without
      # this check, write access to the repo is enough to publish arbitrary
      # tarball contents as bo4e-dotnet-ts-models - main is not protected, and
      # nothing here builds the package, so the tarball is whatever tree the
      # release points at.
      - name: Verify the release commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not an ancestor of origin/main; refusing to publish."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm OIDC trusted publishing requires npm >= 11.5.1; the version bundled
      # with node 24 depends on the runner's tool cache, so install it explicitly.
      - name: Update npm
        run: |
          npm install -g "npm@^11.6"
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"
      # Fail loudly rather than publishing nothing: the action skips the publish
      # (and still exits 0) when package.json's version is already on the
      # registry, so a forgotten version bump used to look like a green release.
      # This is not hypothetical: tag v0.28.1 shipped package.json 0.28.0, and
      # 0.28.1 never reached npm.
      - name: Verify tag matches package.json version
        # passed as env, not interpolated into the script: a tag name may
        # legally contain quotes, $ and ; - as ${{ }} is substituted before
        # bash parses, interpolating it would make the tag executable code
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG_NAME' is not of the form vX.Y.Z or vX.Y.Z-prerelease; refusing to publish."
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "::error::Tag '$TAG_NAME' does not match package.json version '$PACKAGE_VERSION'. Bump package.json before releasing."
            exit 1
          fi
          # the dist-tag follows the version itself, not the "this is a
          # pre-release" checkbox: ticking that box on a final version would
          # strand the release on the "next" tag and leave "latest" behind,
          # green and unnoticed
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "DIST_TAG=next" >> "$GITHUB_ENV"
          else
            # deliberately empty: passing "latest" explicitly would disable
            # npm's own guard against moving "latest" to an older version
            echo "DIST_TAG=" >> "$GITHUB_ENV"
          fi
          echo "publishing $PACKAGE_VERSION from $TAG_NAME"
      # Publishes via OIDC trusted publishing - no token, no fallback.
      # The trusted publisher must be configured at
      # https://www.npmjs.com/package/bo4e-dotnet-ts-models/access
      # with Organization=Hochfrequenz, Repository=bo4e-dotnet-ts-models,
      # Workflow=npm-publish.yml (renaming this file breaks publishing).
      # See: https://docs.npmjs.com/trusted-publishers/
      # Pinned to a commit: this action receives the minted npm token, so a
      # compromise of a mutable @v4 tag would be enough to publish anything.
      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f # v4.1.5
        id: publish
        with:
          provenance: true
          tag: ${{ env.DIST_TAG }}
        env:
          # the OIDC exchange never throws - it logs the real reason (workflow
          # name / repo mismatch, publisher not configured) at verbose level and
          # then npm fails with a misleading ENEEDAUTH
          NPM_CONFIG_LOGLEVEL: verbose
      # the action exits 0 without publishing when the version is already on the
      # registry (and swallows EPUBLISHCONFLICT), so assert something shipped
      - name: Verify the package was actually published
        if: steps.publish.outputs.id == ''
        run: |
          echo "::error::Nothing was published - the version is already on the registry. Bump package.json."
          exit 1
